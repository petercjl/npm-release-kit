name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: patch, minor, major, prerelease, or exact semver
        required: true
        default: patch
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Upgrade npm for OIDC
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm run check --if-present
      - run: npm test --if-present
      - name: Publish @petercjl/npm-release-kit
        run: node bin/npm-release-kit.mjs ci publish --release "${{ inputs.release }}" --tag "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
